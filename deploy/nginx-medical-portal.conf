# 可选：Nginx 反向代理 + HTTPS（推荐在内网统一域名/证书时使用）
# 将此文件放到 /etc/nginx/sites-available/medical-portal，并软链到 sites-enabled
# 然后 `sudo nginx -t && sudo systemctl reload nginx`

server {
    listen 80;
    server_name med.internal.example.com;   # 改成你的内网域名或服务器 IP

    # 如果只用 IP 访问且不需要 HTTPS，可直接用下面这段反向代理，无需证书
    location / {
        proxy_pass http://127.0.0.1:51888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大文件上传（院内数据/目录文件可能较大）
        client_max_body_size 200m;
        proxy_request_buffering off;
    }
}

# 如需 HTTPS（Let's Encrypt / 内网 CA 证书），在上面的 server 块前加：
# server {
#     listen 443 ssl;
#     server_name med.internal.example.com;
#     ssl_certificate     /etc/ssl/medical/fullchain.pem;
#     ssl_certificate_key /etc/ssl/medical/privkey.pem;
#     location / { 同上的 proxy 配置 }
# }
# 并保留 80 端口做 301 跳转：return 301 https://$host$request_uri;
